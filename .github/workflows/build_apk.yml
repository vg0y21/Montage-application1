on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold safely (preserving lib & pubspec)
        run: |
          mkdir -p /tmp/pulse_backup
          cp -r lib /tmp/pulse_backup/lib
          cp pubspec.yaml /tmp/pulse_backup/pubspec.yaml
          flutter create --platforms=android --org com.pulsestudio --project-name pulse_studio .
          rm -rf lib
          cp -r /tmp/pulse_backup/lib ./lib
          cp /tmp/pulse_backup/pubspec.yaml ./pubspec.yaml

      - name: Patch Android minSdk=24 and Gallery permissions
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re

          # Patch build.gradle.kts or build.gradle
          for fname in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(fname)
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', txt)
                  txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', txt)
                  p.write_text(txt)
                  print(f"Patched {fname}")

          # Patch AndroidManifest.xml
          m = Path("android/app/src/main/AndroidManifest.xml")
          if m.exists():
              txt = m.read_text()
              perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          '''
              if "READ_MEDIA_VIDEO" not in txt:
                  txt = txt.replace("<application", perms + "    <application", 1)
              txt = txt.replace('android:label="pulse_studio"', 'android:label="PULSE Studio"')
              if 'requestLegacyExternalStorage' not in txt:
                  txt = txt.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
              m.write_text(txt)
              print("Patched AndroidManifest.xml")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi

      - name: Upload PULSE Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-Studio-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
